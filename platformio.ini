; PlatformIO project configuration
;
; ATmega328P (Nano等) と ATmega328PB 両対応ビルド
; 各 MCU に対して書き込み構成を 2 系統用意する:
;   *-nobootloader : ブートローダなし構成 (従来動作)。ICSP (Arduino-as-ICSP 等の
;                      STK500v1 互換プログラムライタ、19200bps) 経由で書き込む。
;                      アプリは 0x0000 リンク・BOOTRST 焼き込み済み前提。
;   *-bootloader     : ブートローダ前提構成。MiniCore 同梱の optiboot_flash
;                      (Arduino 互換 stk500v1 系統) を前提に、USB シリアル (COM3)
;                      経由 115200bps で書き込む。チップイレーズ (-e) なし
;                      (デフォルトの -D によりブートローダは保持される)。
;
; *-bootloader 系の使い方:
;   初回のみ ICSP プログラマでブートローダ+fuse (BOOTRST 未焼き込み) を書き込む:
;     pio run -e atmega328pb-bootloader -t bootloader --upload-protocol stk500v1 --upload-port <プログラマのCOM>
;   以降は USB シリアル書き込みのみでOK:
;     pio run -e atmega328pb-bootloader --target upload
;   ※ 既に Optiboot 等が入っている板 (Nano クローン等) では初回書き込みは不要。
;
; ビルド切替:
;   pio run -e atmega328p-nobootloader   <- ATmega328P (Nano等) / ICSP 書き込み
;   pio run -e atmega328p-bootloader       <- ATmega328P / ブートローダ経由 COM3
;   pio run -e atmega328pb-nobootloader  <- ATmega328PB / ICSP 書き込み
;   pio run -e atmega328pb-bootloader      <- ATmega328PB / ブートローダ経由 COM3
;   pio run                                <- default_envs で指定された env
;
; 依存:
;   - FastAccelStepper  (gin66)  : 328PB 対応のため scripts/patch_fastaccel.py で 1 行パッチ適用
;   - FastGPIO          (pololu) : 328PB 対応済 (PORTE 含む 26 ピン)、パッチ不要

[platformio]
default_envs = atmega328p-nobootloader

; -----------------------------------------------------------------------------
; ATmega328P (Nano 等) / ブートローダなし (ICSP 書き込み・既存互換)
; -----------------------------------------------------------------------------
[env:atmega328p-nobootloader]
platform = atmelavr
board = ATmega328P                ; MiniCore の ATmega328P/PA バリアント
framework = arduino               ; -> MiniCore が自動選択される (board_build.core=MiniCore)
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
  -P$UPLOAD_PORT
  -e
lib_deps =
  gin66/FastAccelStepper@^0.34.0  ; semver 互換範囲 (0.34.x) で固定
  pololu/FastGPIO                 ; 328PB 対応済、変更不要
lib_ldf_mode = chain+
extra_scripts = pre:scripts/patch_fastaccel.py

; -----------------------------------------------------------------------------
; ATmega328P (Nano 等) / ブートローダ前提 (optiboot_flash @ UART0 115200)
; -----------------------------------------------------------------------------
[env:atmega328p-bootloader]
extends = env:atmega328p-nobootloader
upload_protocol = arduino         ; optiboot_flash と同じ stk500v1 系統のブートローダ用
upload_speed = 115200             ; ブートローダのボーレートと一致させること
upload_port = COM3
upload_flags =                    ; 既定フラグ (-D 他) を使うため ICSP 用の -e を解除
board_upload.maximum_size = 32256 ; 32768 - 512 (bootloader 領域分)

; -----------------------------------------------------------------------------
; ATmega328PB (MiniCore の PB バリアント) / ブートローダなし (ICSP 書き込み)
; -----------------------------------------------------------------------------
[env:atmega328pb-nobootloader]
platform = atmelavr
board = ATmega328PB               ; MiniCore の 328PB バリアント
framework = arduino
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
  -P$UPLOAD_PORT
  -e
build_flags =
  -DUSE_ATMEGA328PB               ; (任意) コード内で PB 専用機能を有効化する場合のフラグ
lib_deps =
  gin66/FastAccelStepper@^0.34.0
  pololu/FastGPIO
lib_ldf_mode = chain+
extra_scripts = pre:scripts/patch_fastaccel.py

; -----------------------------------------------------------------------------
; ATmega328PB / ブートローダ前提 (optiboot_flash @ UART0/UART1 115200)
; -----------------------------------------------------------------------------
[env:atmega328pb-bootloader]
extends = env:atmega328pb-nobootloader
upload_protocol = arduino         ; optiboot_flash と同じ stk500v1 系統のブートローダ用
upload_speed = 115200             ; ブートローダのボーレートと一致させること
upload_port = COM3
upload_flags =                    ; 既定フラグ (-D 他) を使うため ICSP 用の -e を解除
board_upload.maximum_size = 32256 ; 32768 - 512 (bootloader 領域分)
